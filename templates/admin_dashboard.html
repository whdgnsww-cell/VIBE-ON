{% extends 'base.html' %}{% block body %}<section class="top"><div><div class="eyebrow">HOST CONSOLE</div><h1>파티 관리</h1></div><a class="textlink" href="{{url_for('admin_logout')}}">로그아웃</a></section><details class="card"><summary>＋ 새 파티 만들기</summary><form method="post"><label>파티명</label><input name="name" placeholder="8월 솔로파티" required><label>파티 코드</label><input name="code" placeholder="비우면 자동 생성"><label>행사 날짜</label><input type="date" name="event_date"><label>호감 투표 수</label><select name="max_votes"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select><button>파티 생성</button></form></details><section class="grid">{% for e in events %}<a class="eventcard" href="{{url_for('admin_event',event_id=e.id)}}"><div><b>{{e.name}}</b><span>{{e.code}} · {{e.event_date or '날짜 미정'}}</span></div><div class="stats"><strong>{{e.participants}}</strong><small>참가자</small><strong>{{e.votes}}</strong><small>투표</small></div><span class="pill">{{phase_label[e.phase]}}</span></a>{% else %}<div class="card">아직 생성된 파티가 없습니다.</div>{% endfor %}</section>{% endblock %}
